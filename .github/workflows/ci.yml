name: CI

on:
  workflow_dispatch:
  push:
    branches: ["dev", "main"]
    paths:
      - "pyapi/**"
      - "web/**"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "pyapi/**"
      - "web/**"
      - "Dockerfile"
      - ".github/workflows/ci.yml"

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyapi/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pyapi/requirements.txt pytest

      - name: Run backend tests
        working-directory: pyapi
        run: python -m pytest tests

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Check frontend
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_WS_URL: /ws
          SKIP_ENV_VALIDATION: "1"
        run: npm run check
